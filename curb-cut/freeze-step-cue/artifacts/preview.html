<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freeze Step Cue - AIX Preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f7;
        color: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(59, 130, 246, 0.12), transparent 30%),
          linear-gradient(180deg, #f9fafb 0%, #eef2ff 100%);
      }

      .page {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .hero {
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #4f46e5;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 14px;
        color: #4b5563;
        font-size: 14px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 1fr) minmax(320px, 420px);
        gap: 24px;
        align-items: stretch;
      }

      .card {
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 24px;
        box-shadow: 0 18px 56px rgba(15, 23, 42, 0.1);
        backdrop-filter: blur(18px);
        min-height: 100%;
        align-self: stretch;
      }

      .preview-card {
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .preview-shell {
        width: var(--preview-width, 480px);
        margin: 0 auto;
        padding: 0;
        border-radius: 28px;
        background: linear-gradient(180deg, #111827 0%, #030712 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }

      .canvas-frame {
        overflow: hidden;
        border-radius: 22px;
        background: #ffffff;
        width: var(--preview-width, 480px);
        height: var(--preview-height, 352px);
      }

      canvas {
        display: block;
        width: var(--preview-width, 480px);
        height: var(--preview-height, 352px);
        outline: none;
        background: #ffffff;
      }

      .sidebar {
        padding: 24px;
        height: 448px;
        min-height: 0;
        overflow: auto;
        position: sticky;
        top: 24px;
        align-self: start;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
      }

      .status {
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.06);
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: #475569;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .status[data-tone="error"] {
        background: rgba(127, 29, 29, 0.1);
        border-color: rgba(185, 28, 28, 0.16);
        color: #991b1b;
      }

      .controls-panel {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 0 0;
      }

      .controls-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        width: min(100%, 274px);
        justify-items: center;
      }

      .control-button {
        appearance: none;
        border: 1px solid rgba(191, 219, 254, 0.78);
        border-radius: 28px;
        width: 100%;
        max-width: 132px;
        aspect-ratio: 1 / 1;
        min-height: 0;
        background: rgba(255, 255, 255, 0.9);
        color: #334155;
        font-size: 28px;
        font-weight: 600;
        line-height: 1;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 10px 24px rgba(148, 163, 184, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
        cursor: pointer;
        user-select: none;
        transition:
          transform 120ms ease,
          box-shadow 120ms ease,
          border-color 120ms ease,
          background-color 120ms ease;
      }

      .control-button[data-role="tap"] {
        background: #0f172a;
        color: #f8fafc;
        border-color: rgba(15, 23, 42, 0.92);
        font-size: 20px;
        line-height: 1.2;
        box-shadow:
          0 12px 28px rgba(15, 23, 42, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .control-button:hover {
        border-color: rgba(96, 165, 250, 0.52);
      }

      .control-button:active,
      .control-button.is-pressed {
        transform: translateY(2px) scale(0.985);
        box-shadow:
          0 6px 14px rgba(148, 163, 184, 0.14),
          inset 0 2px 8px rgba(15, 23, 42, 0.12);
      }

      .control-button[data-role="tap"]:active,
      .control-button[data-role="tap"].is-pressed {
        box-shadow:
          0 7px 16px rgba(15, 23, 42, 0.18),
          inset 0 2px 10px rgba(2, 6, 23, 0.34);
      }

      .control-button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 3px;
      }

      @media (max-width: 900px) {
        .page {
          width: min(100vw - 24px, 720px);
          padding-top: 24px;
        }

        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          height: auto;
          min-height: 0;
          position: static;
        }

        .preview-shell,
        .canvas-frame,
        canvas {
          width: 100%;
          max-width: 480px;
        }
      }
    </style>
  </head>

    <script type="module">
      const previewConfigNode = document.getElementById("aix-preview-config");
      const previewConfig = JSON.parse(previewConfigNode.textContent ?? "{}");
      const titleNode = document.getElementById("preview-title");
      const sourceNode = document.getElementById("preview-source");
      const versionNode = document.getElementById("preview-version");
      const filesNode = document.getElementById("preview-files");
      const statusNode = document.getElementById("preview-status");
      const canvasHost = document.getElementById("canvas-host");
      const controlButtons = Array.from(document.querySelectorAll(".control-button"));
      const targetButtons = Array.from(document.querySelectorAll(".target-button"));

      let currentCanvas = document.getElementById("preview-canvas");
      let currentView = null;
      let inkModulePromise;
      let controlsBound = false;
      let socket;
      let activeTarget = new URLSearchParams(window.location.search).get("target") === "current" ? "current" : "blank";
      const inkRuntimeLine = "Ink runtime: " + (previewConfig.inkRuntimeVersion || "Unknown");

      function targetMetrics() {
        return activeTarget === "current"
          ? { width: 448, height: 150 }
          : { width: 480, height: 352 };
      }

      function applyTargetStyles() {
        const metrics = targetMetrics();
        document.documentElement.style.setProperty("--preview-width", metrics.width + "px");
        document.documentElement.style.setProperty("--preview-height", metrics.height + "px");
        for (const button of targetButtons) {
          button.dataset.active = button.dataset.target === activeTarget ? "true" : "false";
        }
      }

      function setStatus(message, tone = "info") {
        statusNode.dataset.tone = tone;
        statusNode.textContent = message + "\n" + inkRuntimeLine;
      }

      function decodeBase64(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      }

      function bundleFiles(files) {
        return Object.fromEntries(
          files.map((file) => [file.path, decodeBase64(file.base64)]),
        );
      }

      function updateMeta(state) {
        const title = state.title?.trim() || state.sourceName || sourceNode.textContent || "AIX Preview";
        titleNode.textContent = title;
        sourceNode.textContent = state.sourceName;
        versionNode.textContent = state.version?.trim() || "Unknown";
        filesNode.textContent = String(state.files.length);
        document.title = title + " - AIX Preview";
      }

      function keyCodeFor(key) {
        switch (key) {
          case "Backspace":
            return 8;
          case "Enter":
            return 13;
          case "ArrowUp":
            return 38;
          case "ArrowDown":
            return 40;
          default:
            return 0;
        }

      function dispatchKeyboardEvent(type, key) {
        const keyCode = keyCodeFor(key);
        const event = new KeyboardEvent(type, {
          key,
          code: key,
          bubbles: true,
          cancelable: true,

          await mountState(state, "Initializing Ink runtime...");
          connectWebSocket();
          return;
        }

        await mountState(previewConfig.initialState, "Initializing Ink runtime...");
      }

      boot().catch((error) => {
        const message = error instanceof Error ? error.stack || error.message : String(error);
        setStatus("Preview failed to start.\n\n" + message, "error");
        console.error(error);
      });
    </script>
  </body>
</html>
